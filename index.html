<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The List — Benjamin Gruber</title>
  <meta name="description" content="Forty-four watches. A personal list by Benjamin Gruber.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav">
    <div class="nav-pill">
      <a class="mark" href="#top">The List</a>
      <span class="sep" aria-hidden="true">·</span>
      <div class="views" role="group" aria-label="View">
        <button type="button" class="view-btn is-on" data-view="grid" id="view-grid">Grid</button>
        <button type="button" class="view-btn" data-view="one" id="view-one">One</button>
      </div>
      <span class="sep" aria-hidden="true">·</span>
      <label class="chooser">
        <select id="brand" aria-label="House">
          <option value="all">All houses</option>
        </select>
      </label>
      <span class="sep" aria-hidden="true">·</span>
      <label class="chooser">
        <select id="sort" aria-label="Sort">
          <option value="lot">Lot</option>
          <option value="price-asc">Price</option>
          <option value="price-desc">Price, high</option>
          <option value="brand">A–Z</option>
        </select>
      </label>
      <span class="sep" aria-hidden="true">·</span>
      <span id="count" class="count">44</span>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <h1>The List</h1>
      <p class="whisper">Forty-four watches.</p>
    </section>
    <section id="catalog" class="grid" aria-label="Watches"></section>
    <section id="stage" class="stage" hidden>
      <div class="stage-frame">
        <button class="chevron prev" type="button" id="s-prev" aria-label="Previous">‹</button>
        <figure class="stage-photo" id="s-photo">
          <img id="s-img" alt="">
        </figure>
        <button class="chevron next" type="button" id="s-next" aria-label="Next">›</button>
      </div>
      <p id="s-pos" class="stage-pos" aria-live="polite">1 / 44</p>
      <div class="stage-copy">
        <p id="s-brand" class="s-brand"></p>
        <h2 id="s-name"></h2>
        <p id="s-ref" class="s-ref"></p>
        <p id="s-price" class="s-price"></p>
        <a id="s-link" class="learn" target="_blank" rel="noopener noreferrer">Learn more →</a>
      </div>
      <button type="button" id="hint" class="hint" hidden>← → to move</button>
    </section>
  </main>

  <footer class="foot">
    <p>Benjamin Gruber · August 2026</p>
  </footer>

  <button id="totop" class="totop" type="button" aria-label="Back to top">↑</button>

  <script src="app.js"></script>
</body>
</html>
