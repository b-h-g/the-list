<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The List — Benjamin Gruber</title>
  <meta name="description" content="Forty-four watches. A personal list by Benjamin Gruber.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="mark" href="#top">The List</a>
      <span id="count" class="count">44</span>
      <nav id="brands" class="brands" aria-label="Filter by brand"></nav>
      <label class="sort-wrap">
        <select id="sort" aria-label="Sort">
          <option value="lot">Lot</option>
          <option value="price-asc">Price</option>
          <option value="price-desc">Price, high</option>
          <option value="brand">Brand</option>
        </select>
      </label>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <h1>The List</h1>
      <p class="whisper">Forty-four watches.</p>
    </section>
    <section id="catalog" class="grid" aria-label="Watches"></section>
  </main>

  <footer class="foot">
    <p>Benjamin Gruber · August 2026</p>
  </footer>

  <button id="totop" class="totop" type="button" aria-label="Back to top">↑</button>

  <div id="detail" class="detail" hidden>
    <div class="detail-scrim" data-close></div>
    <article class="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="d-name">
      <button class="detail-close" type="button" data-close aria-label="Close">Close</button>
      <figure class="detail-photo"><img id="d-img" alt=""></figure>
      <div class="detail-copy">
        <p id="d-brand" class="d-brand"></p>
        <h2 id="d-name"></h2>
        <p id="d-ref" class="d-ref"></p>
        <p id="d-price" class="d-price"></p>
        <a id="d-link" class="learn" target="_blank" rel="noopener noreferrer">Learn more</a>
      </div>
    </article>
  </div>

  <script src="app.js"></script>
</body>
</html>
